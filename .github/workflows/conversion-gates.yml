name: Conversion Gates

# Runs the pandas -> Polars conversion gate battery on the polars branch.
#
# The existing workflows are untouched and stay that way: deploy.yml only runs on main, and
# a11y.yml runs on every PR. This adds the third leg -- a PR into the polars branch gets the
# deterministic conversion checks before a human reads it.
#
# Deliberately does NOT execute notebooks. Execution needs the d100 kernel, ~470 MB of data,
# and network access for five chapters; it happens locally and the results are committed. What
# CI verifies is that what was committed is self-consistent: no pandas survives, outputs carry a
# valid execution witness, dropdown mirrors match, and the site still builds.

on:
  pull_request:
    branches: [polars]
  push:
    branches: [polars]
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The battery resolves its baseline with `git show <sha>:...`, so it needs history.
          fetch-depth: 0

      - name: Fetch the baseline commit
        run: |
          BASE_SHA=$(python -c "import json;print(json.load(open('conversion/baseline.lock'))['main_sha'])")
          git fetch --no-tags origin "$BASE_SHA" || git fetch --no-tags origin main

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Self-test the battery
        # The negative control runs first. A battery that passes on the pandas baseline is
        # broken, and every result after it would be meaningless.
        run: python conversion/nb_validate.py --all --self-test

      - name: Gate battery
        run: python conversion/nb_validate.py --all --json conversion/reports/ci.json

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install jupyter-book
        run: npm install -g jupyter-book

      - name: Repo invariants and site build
        run: python conversion/site_gate.py

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversion-gate-report
          path: conversion/reports/
          if-no-files-found: ignore
